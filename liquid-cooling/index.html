<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>数据中心冷却液 · 下一个黄金赛道</title>
<style>
  /* ===== Reset & Base ===== */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif}

  /* ===== Password Gate ===== */
  #gate{position:fixed;z-index:1000;width:100%;height:100%;background:linear-gradient(135deg,#0a1628 0%,#0f2440 40%,#132e50 100%);display:flex;align-items:center;justify-content:center}
  #gate.hidden{display:none}
  .gate-card{width:90%;max-width:400px;text-align:center;padding:48px 36px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;backdrop-filter:blur(20px)}
  .gate-card .icon{font-size:48px;margin-bottom:16px}
  .gate-card h1{color:#e8edf2;font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:1px}
  .gate-card .sub{color:#6b8299;font-size:13px;margin-bottom:28px}
  .gate-card input{width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:rgba(255,255,255,0.05);color:#fff;font-size:15px;text-align:center;letter-spacing:2px;outline:none;transition:border-color .3s}
  .gate-card input:focus{border-color:#2d7fc1}
  .gate-card input::placeholder{color:#4a6278;letter-spacing:1px}
  .gate-card .hint{color:#4a6278;font-size:11px;margin-top:10px}
  .gate-card .btn{margin-top:20px;width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#1a6eb5,#2080d0);color:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .3s;letter-spacing:1px}
  .gate-card .btn:hover{opacity:.9}
  .gate-msg{color:#e05555;font-size:12px;margin-top:12px;min-height:18px}

  /* ===== PPT Container ===== */
  #ppt{width:100%;height:100%;background:#0d1b2a;position:relative;overflow:hidden;overflow-y:auto}
  #slidesContainer{width:100%;min-height:100%;display:flex;flex-direction:column}
  .slide{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 80px 80px;position:relative;scroll-snap-align:start}
  .slide.cover{background:linear-gradient(135deg,#0a1628 0%,#0f2a40 50%,#0d4a35 100%)}
  .slide.transition{background:linear-gradient(135deg,#0f2440,#0a1628)}
  .slide.content{background:#0d1b2a}
  .slide.summary{background:linear-gradient(135deg,#0d1b2a 0%,#132e50 100%)}

  .slide-label{position:absolute;top:32px;left:80px;color:#3a5a78;font-size:11px;letter-spacing:3px;text-transform:uppercase;z-index:2}
  .slide-number{position:absolute;bottom:32px;right:80px;color:#3a5a78;font-size:12px;z-index:2}

  .slide h1{color:#e8edf2;font-size:38px;font-weight:700;line-height:1.3;max-width:800px;text-align:center}
  .slide h2{color:#e0e6ec;font-size:28px;font-weight:600;margin-bottom:24px;line-height:1.4;text-align:center;max-width:800px}
  .slide h3{color:#90b8d8;font-size:18px;font-weight:500;margin-bottom:16px;letter-spacing:1px}
  .slide p,.slide li{color:#b0c4d6;font-size:16px;line-height:1.8}
  .slide .lead{color:#e8edf2;font-size:18px;line-height:1.8;max-width:700px;text-align:center}
  .slide .note{color:#5a7a94;font-size:13px;margin-top:12px}
  .slide .highlight{color:#4db8ff;font-weight:500}
  .slide .subtitle{color:#6b8ca8;font-size:16px;margin-top:12px;line-height:1.6}

  /* Chapter number */
  .chapter-num{font-size:72px;font-weight:800;color:rgba(77,184,255,0.12);line-height:1;margin-bottom:8px;text-align:center}

  /* Two-column & Three-column */
  .two-col{display:flex;gap:40px;width:100%;max-width:960px;flex-wrap:wrap}
  .two-col .col{flex:1;min-width:280px}
  .three-col{display:flex;gap:24px;width:100%;max-width:1000px;flex-wrap:wrap;justify-content:center}
  .three-col .col{flex:1;min-width:250px;max-width:320px}

  /* Cards */
  .card-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;width:100%;max-width:960px}
  .card{flex:1;min-width:200px;max-width:280px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:28px 24px;text-align:center}
  .card .card-icon{font-size:36px;margin-bottom:12px}
  .card h4{color:#d0dae4;font-size:16px;margin-bottom:8px;font-weight:600}
  .card p{color:#90a8be;font-size:14px;line-height:1.7}

  .card.accent{border-color:rgba(77,184,255,0.25);background:rgba(77,184,255,0.06)}
  .card.accent h4{color:#4db8ff}

  /* Data / big numbers */
  .data-row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;align-items:flex-end;margin:20px 0}
  .data-item{text-align:center}
  .big-num{font-size:56px;font-weight:800;color:#4db8ff;line-height:1}
  .big-num-unit{font-size:18px;color:#90b8d8;font-weight:400}
  .data-label{color:#6b8ca8;font-size:13px;margin-top:8px}

  /* Table */
  .tbl-wrap{width:100%;max-width:960px;overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{color:#4db8ff;font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.1);font-size:13px;white-space:nowrap}
  .tbl td{color:#b0c4d6;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.6}
  .tbl .good{color:#4ec98a}
  .tbl .warn{color:#e0a850}
  .tbl .bad{color:#e05555}
  .tbl .brand{color:#4db8ff;font-weight:500}

  /* Flow */
  .flow-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0}
  .flow-step{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px 24px;text-align:center;min-width:140px;max-width:200px}
  .flow-step .step-num{color:#4db8ff;font-size:24px;font-weight:700}
  .flow-step .step-txt{color:#b0c4d6;font-size:14px;margin-top:6px;line-height:1.5}
  .flow-step .step-detail{color:#6b8ca8;font-size:12px;margin-top:4px;line-height:1.5}
  .flow-arrow{color:#3a5a78;font-size:22px}

  /* Highlight box */
  .hl-box{background:rgba(77,184,255,0.08);border:1px solid rgba(77,184,255,0.2);border-radius:10px;padding:20px 28px;max-width:800px;margin:16px auto}
  .hl-box p{color:#c8dce8;font-size:15px;line-height:1.8}
  .hl-box.conclusion{border-left:4px solid #4db8ff;border-radius:0 10px 10px 0}

  /* Quote */
  .quote{max-width:700px;border-left:3px solid #e0a850;padding:16px 24px;margin:20px 0}
  .quote p{color:#c8c0a0;font-size:17px;font-style:italic;line-height:1.8}

  /* Product card */
  .product-card{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:600px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:36px 40px}
  .product-card .prod-icon{font-size:48px;margin-bottom:16px}
  .product-card .prod-name{color:#e8edf2;font-size:26px;font-weight:700;margin-bottom:8px}
  .product-card .prod-tag{display:inline-block;background:rgba(77,184,255,0.15);color:#4db8ff;padding:4px 16px;border-radius:20px;font-size:12px;letter-spacing:1px;margin-bottom:20px}
  .product-card .prod-features{list-style:none;text-align:left;width:100%}
  .product-card .prod-features li{color:#b0c4d6;font-size:14px;line-height:2;padding-left:24px;position:relative}
  .product-card .prod-features li::before{content:"▸";position:absolute;left:0;color:#4db8ff}
  .product-card .prod-scene{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.06);text-align:left;width:100%}
  .product-card .prod-scene h5{color:#90b8d8;font-size:13px;margin-bottom:6px;letter-spacing:1px}
  .product-card .prod-scene p{color:#7a94a8;font-size:13px;line-height:1.7}

  /* TOC Grid */
  .toc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:840px;width:100%}
  .toc-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:24px 20px;text-align:center;transition:border-color .3s}
  .toc-item .toc-num{font-size:36px;font-weight:800;color:#4db8ff;line-height:1}
  .toc-item .toc-title{color:#d0dae4;font-size:15px;font-weight:600;margin-top:12px}
  .toc-item .toc-desc{color:#5a7a94;font-size:12px;margin-top:6px;line-height:1.5}

  /* Checklist */
  .checklist{list-style:none;max-width:700px;text-align:left}
  .checklist li{color:#b0c4d6;font-size:15px;line-height:2;padding-left:28px;position:relative}
  .checklist li::before{content:"☐";position:absolute;left:0;color:#3a6a8a;font-size:16px}

  /* Tag */
  .tag{display:inline-block;background:rgba(77,184,255,0.12);color:#4db8ff;padding:4px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;margin-bottom:16px}

  /* Exhibition cards */
  .expo-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:960px}
  .expo-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px;min-width:240px;max-width:300px;flex:1}
  .expo-card .expo-date{color:#4db8ff;font-size:12px;font-weight:500;letter-spacing:1px}
  .expo-card .expo-name{color:#d0dae4;font-size:14px;font-weight:600;margin:6px 0}
  .expo-card .expo-loc{color:#6b8ca8;font-size:12px}

  /* Contact card */
  .contact-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:36px 40px;max-width:550px;text-align:center}
  .contact-card .contact-icon{font-size:48px;margin-bottom:16px}
  .contact-card h3{color:#e8edf2;font-size:22px;margin-bottom:20px}
  .contact-card .contact-row{display:flex;align-items:center;gap:12px;justify-content:center;color:#b0c4d6;font-size:14px;margin:10px 0}

  /* Section header within slide */
  .section-title{color:#4db8ff;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-align:center}

  /* ===== Navigation ===== */
  #nav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:center;gap:20px;background:linear-gradient(transparent,rgba(13,27,42,.95));padding:0 20px;visibility:hidden;opacity:0;transition:opacity .3s}
  #nav.visible{visibility:visible;opacity:1}
  .nav-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#b0c4d6;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
  .nav-btn:hover{background:rgba(255,255,255,0.12);color:#fff}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .page-indicator{color:#5a7a94;font-size:13px;min-width:80px;text-align:center}
  .nav-arrows{display:flex;gap:8px}

  /* Responsive */
  @media (max-width:768px){
    .slide{padding:40px 24px 80px}
    .slide h1{font-size:24px}
    .slide h2{font-size:20px}
    .slide h3{font-size:16px}
    .slide p,.slide li{font-size:14px;line-height:1.7}
    .slide-label{left:24px;top:20px}
    .slide-number{right:24px;bottom:24px}
    .card-row{flex-direction:column;align-items:center}
    .card{max-width:100%}
    .big-num{font-size:36px}
    .tbl{font-size:12px}
    .tbl td,.tbl th{padding:8px 6px}
    .flow-row{flex-direction:column;gap:8px}
    .flow-arrow{transform:rotate(90deg)}
    .two-col{flex-direction:column;gap:24px}
    .two-col .col{min-width:100%}
    .three-col{flex-direction:column;align-items:center}
    .three-col .col{max-width:100%}
    .toc-grid{grid-template-columns:repeat(2,1fr);gap:16px}
    .tbl-wrap{max-width:100%}
    .data-row{gap:24px}
    .chapter-num{font-size:48px}
    .product-card{padding:24px 20px}
    .expo-row{flex-direction:column;align-items:center}
    .expo-card{max-width:100%}
  }
  @media (max-width:480px){
    .toc-grid{grid-template-columns:1fr}
    .big-num{font-size:30px}
    .slide h1{font-size:20px}
  }
</style>
</head>
<body>

<!-- ========== PASSWORD GATE ========== -->
<div id="gate">
  <div class="gate-card">
    <div class="icon">🔐</div>
    <h1>数据中心冷却液</h1>
    <div class="sub">下一个黄金赛道 · 中间商自学课件</div>
    <input type="password" id="pwd" placeholder="请输入访问密码" maxlength="32" autocomplete="off">
    <div class="hint">密码由课件提供方私发，请勿外传</div>
    <button class="btn" onclick="checkPwd()">进入课件</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<!-- ========== PPT SLIDES ========== -->
<div id="ppt">
  <div id="slidesContainer"></div>
</div>

<!-- ========== NAVIGATION ========== -->
<nav id="nav">
  <div class="nav-arrows">
    <button class="nav-btn" id="prevBtn" onclick="goSlide(-1)">◀ 上一页</button>
    <button class="nav-btn" id="nextBtn" onclick="goSlide(1)">下一页 ▶</button>
  </div>
  <span class="page-indicator" id="pageInd">1 / 29</span>
</nav>

<script>
// ===== Password System =====
const PWDS = {
  basic: {
    hash: '5ed2c592965e8deaeefd7ae75a48747bb0a47ca186ed278408344c51cd31767a',
    maxSlide: 26
  },
  full: {
    hash: 'eb10461fc8affec296f6822ba924287712b18ddd5cb1cb258c018d44aa0d6cd8',
    maxSlide: 29
  }
};

async function sha256(msg) {
  const buf = new TextEncoder().encode(msg);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPwd() {
  const input = document.getElementById('pwd').value.trim();
  const msg = document.getElementById('gateMsg');
  if (!input) { msg.textContent = '请输入密码'; return; }

  const hash = await sha256(input);

  if (hash === PWDS.full.hash) {
    unlock(PWDS.full.maxSlide);
  } else if (hash === PWDS.basic.hash) {
    unlock(PWDS.basic.maxSlide);
  } else {
    msg.textContent = '密码错误，请重试';
    document.getElementById('pwd').value = '';
  }
}

function unlock(maxSlide) {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('nav').classList.add('visible');
  totalSlides = maxSlide;
  renderAll();
  renderSlide(0);
  document.getElementById('pwd').value = '';
}

// ===== Slide System =====
let currentSlide = 0;
let totalSlides = 29;

function renderAll() {
  const container = document.getElementById('slidesContainer');
  let html = '';
  for (let i = 0; i < totalSlides; i++) {
    const slide = slides[i];
    if (!slide) break;
    html += slide.html.replace(/{num}/g, i + 1);
  }
  container.innerHTML = html;
}

function renderSlide(idx) {
  // Hide all, show current
  const allSlides = document.querySelectorAll('#slidesContainer .slide');
  allSlides.forEach((s, i) => {
    if (i === idx) {
      s.classList.add('active');
      s.scrollIntoView({behavior:'smooth',block:'start'});
    } else {
      s.classList.remove('active');
    }
  });
  document.getElementById('pageInd').textContent = `${idx+1} / ${totalSlides}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx >= totalSlides - 1;
  currentSlide = idx;
}

function goSlide(dir) {
  const next = currentSlide + dir;
  if (next < 0 || next >= totalSlides) return;
  renderSlide(next);
}

// ===== Keyboard, Touch & Mouse =====
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('keydown', e => {
  if (document.getElementById('gate').classList.contains('hidden')) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goSlide(1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goSlide(-1); }
    if (e.key === 'Home') { e.preventDefault(); renderSlide(0); }
    if (e.key === 'End') { e.preventDefault(); renderSlide(totalSlides - 1); }
  } else {
    if (e.key === 'Enter') checkPwd();
  }
});
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  if (!document.getElementById('gate').classList.contains('hidden')) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    goSlide(dx < 0 ? 1 : -1);
  }
});

// Wheel with debounce
let wheelDebounce = false;
document.addEventListener('wheel', e => {
  if (!document.getElementById('gate').classList.contains('hidden')) return;
  if (wheelDebounce) return;
  wheelDebounce = true;
  setTimeout(() => { wheelDebounce = false; }, 600);
  if (e.deltaY > 30) goSlide(1);
  else if (e.deltaY < -30) goSlide(-1);
}, {passive:true});

// ===== Slide Data =====
const slides = [];

function S(label, cls, html) {
  const labelHtml = label ? `<div class="slide-label">${label}</div>` : '';
  slides.push({
    html: `<div class="slide ${cls}">
      ${labelHtml}
      ${html}
      <div class="slide-number">{num}</div>
    </div>`
  });
}

// ============================================================
// SLIDE 1: Cover
// ============================================================
S('', 'cover', `
  <h1 style="font-size:44px;margin-bottom:20px">数据中心冷却液<br><span style="color:#4db8ff">液冷将是下一个黄金赛道</span></h1>
  <p class="lead">从风冷到液冷，把握千亿级市场转型机遇</p>
  <div style="margin-top:40px">
    <span class="tag" style="font-size:16px;padding:8px 24px">苏能® 冷却液</span>
  </div>
  <p class="note" style="margin-top:16px">2026年8月</p>
`);

// ============================================================
// SLIDE 2: Table of Contents
// ============================================================
S('', 'content', `
  <h2 style="margin-bottom:36px">CONTENTS</h2>
  <div class="toc-grid">
    <div class="toc-item"><div class="toc-num">01</div><div class="toc-title">行业变革与机遇</div><div class="toc-desc">为何液冷是未来？</div></div>
    <div class="toc-item"><div class="toc-num">02</div><div class="toc-title">市场洞察与趋势</div><div class="toc-desc">千亿蓝海，蓄势待发</div></div>
    <div class="toc-item"><div class="toc-num">03</div><div class="toc-title">液冷技术深度解析</div><div class="toc-desc">从原理到实践</div></div>
    <div class="toc-item"><div class="toc-num">04</div><div class="toc-title">苏能® 产品矩阵</div><div class="toc-desc">为不同场景量身定制</div></div>
    <div class="toc-item"><div class="toc-num">05</div><div class="toc-title">竞品格局与选型策略</div><div class="toc-desc">知己知彼，百战不殆</div></div>
    <div class="toc-item"><div class="toc-num">06</div><div class="toc-title">行动指南与未来展望</div><div class="toc-desc">开启您的液冷业务</div></div>
  </div>
`);

// ============================================================
// SLIDE 3: AI算力需求爆炸式增长 + 传统风冷困境
// ============================================================
S('01 · 行业变革与机遇', 'content', `
  <div class="chapter-num">01</div>
  <h2>我们正处在一个怎样的时代？</h2>
  <div class="two-col" style="margin-top:20px">
    <div class="col">
      <h3>🚀 算力需求的爆炸式增长</h3>
      <p style="margin-top:8px"><span class="highlight">AI大模型</span> — 从GPT-4到GPT-5，模型参数从万亿级向十万亿级迈进，训练算力呈指数级增长。</p>
      <p style="margin-top:8px"><span class="highlight">数字经济</span> — 云计算、大数据、物联网、自动驾驶普及，2025年全球数据量预计达180 ZB。</p>
      <p style="margin-top:8px"><span class="highlight">芯片功耗飙升</span> — NVIDIA Blackwell GB200，单模块功耗高达120kW，远超风冷散热极限。</p>
    </div>
