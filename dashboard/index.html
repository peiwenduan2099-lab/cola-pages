<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文哥 · AI 工作台</title>
<style>
:root{
  --bg:#06090f;--surface:#0d1117;--surface2:#161b22;--border:#21262d;
  --text:#c9d1d9;--text2:#8b949e;--text3:#484f58;--white:#e6edf3;
  --green:#3fb950;--blue:#58a6ff;--amber:#d29922;--rose:#f85149;--violet:#a371f7;--cyan:#39d2c0;
  --grad-g:linear-gradient(135deg,#238636,#3fb950);--grad-b:linear-gradient(135deg,#1f6feb,#58a6ff);
  --grad-a:linear-gradient(135deg,#9e6a03,#d29922);--grad-v:linear-gradient(135deg,#6e40c9,#a371f7);
  --rad:12px;--rad-sm:8px
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
/* Sidebar */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:16px;color:var(--white);font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-logo h1 .live{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 8px rgba(63,185,80,.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sidebar-logo .ver{font-size:10px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:8px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:12px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rad-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--surface2);color:var(--white)}
.nav-item.active{background:var(--surface2);color:var(--white);font-weight:600}
.nav-item .ni-icon{font-size:16px;width:20px;text-align:center}
.nav-item .ni-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:auto}
.badge-g{background:rgba(63,185,80,.15);color:var(--green)}
.badge-b{background:rgba(88,166,255,.15);color:var(--blue)}
.badge-a{background:rgba(210,153,34,.15);color:var(--amber)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.sidebar-footer .user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.sidebar-footer .avatar{width:28px;height:28px;border-radius:50%;background:var(--grad-g);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.main-header h2{font-size:18px;color:var(--white);font-weight:700}
.main-header .actions{display:flex;gap:8px}
.btn{font-size:12px;font-weight:600;padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--border);color:var(--white)}
.btn-primary{background:var(--grad-g);border:none;color:#fff}
.btn-primary:hover{opacity:.9}
.btn-blue{background:var(--grad-b);border:none;color:#fff}
.btn-blue:hover{opacity:.9}
.main-content{flex:1;overflow-y:auto;padding:24px 28px}

/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
.card:hover{border-color:rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:14px;color:var(--white);font-weight:600;display:flex;align-items:center;gap:8px}
.card-header .ch-icon{font-size:16px}
.card-body{padding:16px 20px;flex:1}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px}

/* Action card */
.action-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:all .15s}
.action-row:last-child{border-bottom:none}
.action-row:hover .ar-label{color:var(--white)}
.ar-left{display:flex;align-items:center;gap:10px}
.ar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ar-label{font-size:13px;color:var(--text);transition:color .15s}
.ar-meta{font-size:11px;color:var(--text2)}
.ar-right{display:flex;align-items:center;gap:6px}
.ar-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.tag-go{background:rgba(63,185,80,.12);color:var(--green)}
.tag-run{background:rgba(88,166,255,.12);color:var(--blue)}
.tag-wait{background:rgba(210,153,34,.12);color:var(--amber)}
.tag-open{background:rgba(163,113,247,.12);color:var(--violet)}
.ar-hint{font-size:9px;color:var(--text3)}

/* Stat row */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:16px 20px;text-align:center}
.stat-cell .sv{font-size:28px;font-weight:800;color:var(--white);letter-spacing:-1px}
.stat-cell .sl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500}

/* Tooltip on copy */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}

/* Section title */
.sec-title{font-size:13px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:12px;margin-top:8px}

@media(max-width:900px){.sidebar{display:none}.cards{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

// Copy to clipboard
function copyCmd(cmd){navigator.clipboard.writeText(cmd).then(function(){showToast('✅ 指令已复制，到 Cola 粘贴执行')})}

// Tab switching
document.querySelectorAll('.nav-item').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active')});this.classList.add('active');renderTab(this.dataset.tab)})});

// File links - Windows paths
function fileLink(p){return'file:///'+p.replace(/\\/g,'/')}

function renderTab(tab){

}
